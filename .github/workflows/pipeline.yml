name: Pipeline

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after quality gate passes
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml

  deploy:
    needs: [quality]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true)
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@9933a7461a312cfaac526ccc5907357a7e3f669a # v2026.25
    with:
      auto-rollback: true
      runtime-version: "1.4.0"
      install-policy: trusted
      artifact-name: b1-dist
      artifact-path: "."
      d1-migrations: true
      d1-databases: life
      environment: production
      concurrency-group: deploy-life-production
      timeout-minutes: 20
      verify-command: |
        EXPECTED=$(jq -r .version package.json)
        LIVE=$(curl -fsS https://life.worker.hexly.ai/api/live)
        ACTUAL=$(echo "$LIVE" | jq -r .version)
        DB=$(echo "$LIVE" | jq -r .database)
        test "$ACTUAL" = "$EXPECTED"
        test "$DB" = "ok"

        AUTH_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" https://life.hexly.ai/)
        test "$AUTH_STATUS" = "302"
      verify-retries: 6
      verify-retry-seconds: 5
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
