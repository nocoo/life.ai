name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v2.0.2)"
        required: false
        type: string
        default: ""
      source-run-id:
        description: "Successful CI run ID to deploy"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy Worker (production)
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      expected-workflow-path: ".github/workflows/ci.yml"
      expected-workflow-name: "CI"
      source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || inputs.source-run-id || '' }}
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag || '' }}
      package-version-match: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
      runtime-version: "1.4.0"
      node-version: "26.8.1"
      install-policy: "trusted"
      deploy-script: "bun run deploy"
      wrangler-version: "4.136.3"
      environment: production
      concurrency-group: deploy-life-production
      timeout-minutes: 20
      verify-command: |
        EXPECTED=$(jq -r .version package.json)
        LIVE=$(curl -fsS https://life.worker.hexly.ai/api/live)
        ACTUAL=$(echo "$LIVE" | jq -r .version)
        DB=$(echo "$LIVE" | jq -r .database)
        test "$ACTUAL" = "$EXPECTED"
        test "$DB" = "ok"

        AUTH_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" https://life.hexly.ai/)
        test "$AUTH_STATUS" = "302"
      verify-retries: 6
      verify-retry-seconds: 5
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
