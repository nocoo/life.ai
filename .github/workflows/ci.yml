# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1, S2, S3, G1, G2, B1, L1, L2, L3, Z1 via quality.yml;
# na L1.5, P1 in slot-status。slot 外保留 l1-proof（pre-commit 拒绝证明）。nocoo/base-ci v2026.12：顶层 slot job、L2/L3 证据制品。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: life-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: "1.4.0"
      node-version: "26.12.1"
      install-policy: trusted
      coverage-path: coverage/
      test-command: bun run test:coverage
      osv-config: osv-scanner.toml
      gitleaks-config: .gitleaks.toml
      security: true
      security-command: bun run gate:security
      build: true
      build-command: bun run build
      workflow-lint: true
      workflow-lint-required-workflow: nocoo/base-ci/.github/workflows/deploy-worker.yml
      workflow-lint-yamllint: true
      l2: true
      l2-command: bun run test:l2
      l2-artifact-name: l2-evidence
      l2-artifact-path: |
        test-results/
        playwright-report/
      l2-artifact-retention-days: 7
      l3: true
      l3-browsers: chromium
      l3-command: bun run test:l3
      l3-artifact-name: l3-evidence
      l3-artifact-path: |
        test-results/
        playwright-report/
      l3-artifact-retention-days: 7
      env-json: '{"WRANGLER_SEND_METRICS": "false", "CI": "true"}'
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "无 @cloudflare/vitest-pool-workers；tests/worker 为 Vitest Node 环境，已纳入 L1 覆盖率"},
        "L2": {"status": "impl"},
        "L3": {"status": "impl"},
        "P1": {"status": "na", "reason": "package.json 为 private，不发布 npm 包"},
        "Z1": {"status": "impl"}}

  l1-proof:
    name: L1 pre-commit rejection proof
    uses: nocoo/base-ci/.github/workflows/test-job.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: "1.4.0"
      node-version: "26.12.1"
      install-policy: trusted
      timeout-minutes: 5
      command: bun run test:l1
