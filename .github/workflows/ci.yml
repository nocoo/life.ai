name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  node-preflight:
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime: "none"
      node-version: "22.20.0"
      timeout-minutes: 5
      command: "node scripts/check-node-version.mjs"

  quality:
    needs: node-preflight
    uses: nocoo/base-ci/.github/workflows/quality.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: "1.4.2"
      node-version: "22.20.0"
      install-policy: "trusted"
      coverage-path: "coverage"
      extra-install-dirs: "dashboard"
      test-command: "bun run test:coverage"
      lint-command: "bun run lint"
      typecheck: false
      disabled-check-reasons: '{"typecheck": "no root tsconfig; subprojects checked via lint and tests"}'
      l2: true
      l2-command: "bun run test:l2"
      l3: true
      l3-command: "bun run test:e2e:bdd"
      l3-browser: "chromium"
      l3-browser-directory: "dashboard"
