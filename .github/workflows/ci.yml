name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  node-preflight:
    # setup-bun does not read .node-version. Explicitly stand up the Node
    # runtime declared in .node-version and run the package-manager-agnostic
    # engines.node check so a Node runtime below the required minimum aborts
    # CI at preflight instead of leaking into the Bun-driven quality job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node scripts/check-node-version.mjs

  quality:
    needs: node-preflight
    uses: nocoo/base-ci/.github/workflows/bun-quality.yml@aec4adc1a817c56790d1698329ef9398a15a754a  # v2026.5
    with:
      ignore-scripts: true
      trusted-native-deps: "better-sqlite3"
      extra-install-dirs: "dashboard"
      test-command: "bun run test:coverage"
      lint-command: "bun run lint"
      typecheck-command: "true"
      enable-l2: "true"
      l2-command: "bun run test:l2"
      enable-l3: "true"
      l3-command: "bun run test:e2e:bdd"
      l3-browser: "chromium"
      # base-ci's own browser install runs `bunx playwright install` from repo
      # root, which resolves to npm-latest playwright (currently 1.62.0 →
      # chromium rev 1234). dashboard is pinned to playwright 1.61.1 (rev
      # 1228), so the runtime loads the wrong cache path and fails to launch.
      # Re-run the install from dashboard so the pinned CLI writes the bundle
      # under chromium-1228; --with-deps handled by base-ci's prior step.
      pre-command: "cd dashboard && bunx playwright install chromium"
    secrets: inherit
