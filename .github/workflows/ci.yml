name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: life-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae # main 2026-10-22
    with:
      runtime-version: "1.4.0"
      node-version: "26.12.1"
      install-policy: trusted
      build: true
      security: false
      disabled-check-reasons: '{"security":"A dedicated G2 job scans the complete reviewable tree and root lockfile."}'
      coverage-path: coverage/

  security:
    uses: nocoo/base-ci/.github/workflows/security.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae # main 2026-10-22
    with:
      package-manager: bun
      runtime-version: "1.4.0"
      node-version: "26.12.1"
      install-policy: trusted
      scan-secrets: false
      scan-dependencies: false
      security-command: bun run gate:security
      report-path: test-results/security/

  integration:
    name: ${{ matrix.tier }} local Worker + SQLite
    strategy:
      fail-fast: false
      matrix:
        tier: [l2, l3]
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae # main 2026-10-22
    with:
      runtime-version: "1.4.0"
      node-version: "26.12.1"
      install-policy: trusted
      timeout-minutes: 15
      browser: ${{ matrix.tier == 'l3' && 'chromium' || '' }}
      command: bun run test:${{ matrix.tier }}
      artifact-name: ${{ matrix.tier }}-evidence
      artifact-path: |
        test-results/
        playwright-report/

  workflows:
    uses: nocoo/base-ci/.github/workflows/workflow-lint.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae # main 2026-10-22
